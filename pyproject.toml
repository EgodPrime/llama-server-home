[project]
name = "llama-server-home"
version = "0.1.0"
description = "Monolith llama-server management platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "jinja2>=3.1.0",
    "loguru>=0.7.3",
    "nvidia-ml-py>=13.590.48",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit"
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "W", "I", "N"]

[project.scripts]
llama-server-home = "lsh.server.main:cli_main"
