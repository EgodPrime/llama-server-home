{% extends "base.html" %}
{% block title %}Profiles - llama-server-home{% endblock %}
{% block content %}
<div x-data="profilesPage()" x-init="init()" class="max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Profiles</h1>
    <button @click="showCreate = true" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ New Profile</button>
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left">Name</th>
          <th class="px-4 py-2 text-left">Instances</th>
          <th class="px-4 py-2 text-left">Created</th>
          <th class="px-4 py-2 text-left">Actions</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="p in profiles" :key="p.profile_name">
          <tr class="border-t">
            <td class="px-4 py-2 font-medium" x-text="p.profile_name"></td>
            <td class="px-4 py-2" x-text="p.instances.length"></td>
            <td class="px-4 py-2 text-xs text-gray-500" x-text="new Date(p.created_at * 1000).toLocaleString()"></td>
            <td class="px-4 py-2 space-x-2">
              <button @click="viewProfile(p)" class="text-xs bg-gray-500 text-white px-2 py-1 rounded hover:bg-gray-600">View</button>
              <button @click="deployProfile(p.profile_name)" class="text-xs bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700">Deploy</button>
              <button @click="deleteProfile(p.profile_name)" class="text-xs bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">Delete</button>
            </td>
          </tr>
        </template>
        <tr x-show="profiles.length === 0">
          <td colspan="4" class="px-4 py-4 text-gray-500 text-center">No profiles</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Create Modal -->
  <div x-show="showCreate" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
       x-cloak @click.self="showCreate = false">
    <div class="bg-white rounded-lg p-4 w-full max-w-2xl max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold">Create Profile</h3>
        <button @click="showCreate = false" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Profile Name</label>
        <input type="text" x-model="newName" class="w-full border rounded px-3 py-2 text-sm">
      </div>
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Instances (JSON)</label>
        <textarea x-model="instancesJson" rows="8"
                  placeholder='[{"instance_name":"a","port":8081,"model_path":"models/m.gguf","config":{"--n_ctx":"4096"}}]'
                  class="w-full border rounded px-3 py-2 text-sm font-mono"></textarea>
      </div>
      <div class="flex gap-2">
        <button @click="createProfile()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Create</button>
        <button @click="showCreate = false" class="px-4 py-2 rounded border hover:bg-gray-50">Cancel</button>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div x-show="showView" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
       x-cloak @click.self="showView = false">
    <div class="bg-white rounded-lg p-4 w-full max-w-2xl max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold">Profile: <span x-text="viewData.profile_name"></span></h3>
        <button @click="showView = false" class="text-gray-500 hover:text-gray-700">&times;</button>
      </div>
      <pre class="bg-gray-900 text-green-400 text-xs p-3 rounded overflow-auto font-mono"
           x-text="JSON.stringify(viewData, null, 2)"></pre>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function profilesPage() {
  return {
    profiles: [],
    showCreate: false,
    showView: false,
    newName: '',
    instancesJson: '',
    viewData: {},
    init() { this.fetchData() },
    async fetchData() {
      try {
        this.profiles = await fetch('/api/profiles/list').then(r => r.json())
      } catch (e) { console.error(e) }
    },
    async createProfile() {
      if (!this.newName) { alert('Name required'); return }
      let instances
      try { instances = JSON.parse(this.instancesJson) } catch { alert('Invalid JSON'); return }
      try {
        const res = await fetch('/api/profiles/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profile_name: this.newName, instances }),
        })
        const data = await res.json()
        if (res.ok) { this.showCreate = false; this.newName = ''; this.instancesJson = ''; this.fetchData() }
        else alert(data.detail || 'Failed')
      } catch (e) { alert(e.message) }
    },
    async deleteProfile(name) {
      if (!confirm(`Delete profile "${name}"?`)) return
      try { await fetch(`/api/profiles/${name}`, { method: 'DELETE' }); this.fetchData() }
      catch (e) { alert(e.message) }
    },
    async deployProfile(name) {
      if (!confirm(`Deploy profile "${name}"?`)) return
      try {
        const res = await fetch(`/api/profiles/${name}/deploy`, { method: 'POST' })
        const data = await res.json()
        if (res.ok) alert(data.message)
        else alert(data.detail || 'Failed')
      } catch (e) { alert(e.message) }
    },
    async viewProfile(p) {
      try {
        this.viewData = await fetch(`/api/profiles/${p.profile_name}`).then(r => r.json())
        this.showView = true
      } catch (e) { alert(e.message) }
    }
  }
}
</script>
{% endblock %}
